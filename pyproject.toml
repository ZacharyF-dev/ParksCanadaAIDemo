[project]
name = "mini-jira-mcp"
version = "0.1.0"
description = "Simple Jira-like MCP server with FastMCP and a tiny polling web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "fastmcp>=0.2.0",
    "agent-framework-openai>=1.14.2,<2",
    "azure-identity>=1.25.0",
    "mcp>=1.28.0",
    "python-dotenv>=1.0.0",
    "chainlit>=2.12.0,<3",
    "chromadb>=1.0.0",
]

[tool.setuptools]
package-dir = {jira_foundry_agent = "demos/jira_foundry_agent/src/jira_foundry_agent", knowledge_agent = "demos/knowledge_agent/src/knowledge_agent", workspace_agent = "demos/workspace_agent/src/workspace_agent", parks_booking_agent = "demos/parks_booking_agent/src/parks_booking_agent", parks_booking_dashboard = "demos/parks_booking_dashboard", pc411_directory_dashboard = "demos/pc411_directory_dashboard", markdown_rag_mcp = "servers/markdown_rag_mcp/src/markdown_rag_mcp", pc411_directory_mcp = "servers/pc411_directory_mcp/src/pc411_directory_mcp", parks_canada_booking_mcp = "servers/parks_canada_booking_mcp/src/parks_canada_booking_mcp"}
packages = ["app", "jira_foundry_agent", "knowledge_agent", "workspace_agent", "parks_booking_agent", "parks_booking_dashboard", "pc411_directory_dashboard", "markdown_rag_mcp", "pc411_directory_mcp", "parks_canada_booking_mcp"]

[project.scripts]
jiralite = "run:main"
jira-foundry-agent = "jira_foundry_agent.chainlit_app:main"
knowledge-agent = "knowledge_agent.chainlit_app:main"
workspace-agent = "workspace_agent.chainlit_app:main"
parks-booking-agent = "parks_booking_agent.chainlit_app:main"
parks-booking-dashboard = "parks_booking_dashboard.app:main"
pc411-directory-dashboard = "pc411_directory_dashboard.app:main"
markdown-rag-index = "markdown_rag_mcp.indexer:main"
markdown-rag-mcp = "markdown_rag_mcp.server:main"
pc411-directory-import = "pc411_directory_mcp.import_structure:main"
pc411-directory-seed = "pc411_directory_mcp.seed:main"
pc411-directory-mcp = "pc411_directory_mcp.server:main"
parks-canada-booking-seed = "parks_canada_booking_mcp.seed:main"
parks-canada-booking-mcp = "parks_canada_booking_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"