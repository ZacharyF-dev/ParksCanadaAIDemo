[project]
name = "mini-jira-mcp"
version = "0.1.0"
description = "Simple Jira-like MCP server with FastMCP and a tiny polling web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "fastmcp>=0.2.0",
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"