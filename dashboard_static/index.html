<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Services</title>
  <style>
    :root{--ink:#242424;--muted:#66706f;--pine:#285943;--pine-dark:#1d4534;--cream:#f5f3ed;--paper:#fffefa;--line:#d7d8d2;--red:#aa4b36}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:40px 24px 52px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:3px solid var(--pine);padding-bottom:24px;margin-bottom:35px}.eyebrow{color:var(--pine);font-weight:700;letter-spacing:.08em;font-size:.75rem;text-transform:uppercase}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(2.25rem,5vw,3.65rem);line-height:1;margin:.42rem 0 .7rem;color:var(--ink)}.intro{max-width:630px;color:var(--muted);font-size:1rem;line-height:1.55;margin:0}.badge{color:var(--pine-dark);border:1px solid #a8b8ae;background:#edf3ec;padding:.48rem .7rem;font-size:.82rem;white-space:nowrap}.section{margin-top:34px}.section-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}.section-heading h2{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;margin:0}.section-heading p{color:var(--muted);font-size:.92rem;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px;display:flex;min-height:182px;flex-direction:column}.card h3{font-size:1.04rem;margin:10px 0 7px}.card p{color:var(--muted);line-height:1.45;flex:1;margin:0;font-size:.94rem}.status{font-size:.71rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.online{color:var(--pine)}.offline{color:var(--red)}.link{display:inline-flex;width:max-content;margin-top:18px;align-items:center;padding:0 0 3px;border-bottom:1px solid var(--pine);color:var(--pine-dark);text-decoration:none;font-size:.91rem;font-weight:700}.link:hover{color:var(--ink);border-color:var(--ink)}.note{border-top:1px solid var(--line);padding-top:18px;margin-top:36px;color:var(--muted);font-size:.86rem;line-height:1.5}@media(max-width:650px){header{display:block}.badge{display:inline-block;margin-top:1rem}.section-heading{display:block}.section-heading p{margin-top:4px}}
  </style>
</head>
<body><main class="wrap"><header><div><div class="eyebrow">Parks Canada demo workspace</div><h1>Local Services</h1><p class="intro">Quick links to the local chat tools, MCP endpoints, and supporting dashboards used in this workspace.</p></div><div class="badge">Local access · 127.0.0.1</div></header><div id="services"></div><p class="note">The PC411 directory uses synthetic personnel data. Service availability is refreshed every 10 seconds.</p></main><script>const root=document.getElementById('services');const groups=[['chatbot','Chatbots','Conversational demo interfaces'],['mcp','MCP servers','Endpoints for local tools and integrations'],['application','Dashboards','Supporting operational views']];const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=s=>`<article class="card"><div class="status ${s.online?'online':'offline'}">${s.online?'● Available':'● Unavailable'}</div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><a class="link" href="${s.url}" target="_blank" rel="noreferrer">Open ↗</a></article>`;async function load(){try{const services=await (await fetch('/api/services')).json();root.innerHTML=groups.map(([category,title,description])=>{const items=services.filter(s=>s.category===category);return items.length?`<section class="section"><div class="section-heading"><h2>${title}</h2><p>${description}</p></div><div class="grid">${items.map(card).join('')}</div></section>`:''}).join('')}catch{root.innerHTML='<p>Unable to load local service status.</p>'}}load();setInterval(load,10000);</script></body>
</html>
