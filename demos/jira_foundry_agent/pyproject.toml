[project]
name = "jira-foundry-agent-demo"
version = "0.1.0"
description = "Local Microsoft Agent Framework demo for the JiraLite MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "agent-framework-openai>=1.14.2,<2",
    "azure-identity>=1.25.0",
    "mcp>=1.28.0",
    "chainlit>=2.12.0,<3",
]

[project.scripts]
jira-foundry-agent = "jira_foundry_agent.chainlit_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
