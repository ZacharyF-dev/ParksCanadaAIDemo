[project]
name = "workspace-agent-demo"
version = "0.1.0"
description = "Chainlit demo that uses all local JiraLite workspace MCP servers"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-openai>=1.14.2,<2",
    "azure-identity>=1.25.0",
    "chainlit>=2.12.0,<3",
    "mcp>=1.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
workspace-agent = "workspace_agent.chainlit_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
