{% extends "base.html" %} {% block content %}
<section class="page-header">
  <h1>Tickets</h1>
</section>

<form method="get" class="card filter-form">
  <input
    type="text"
    name="search"
    placeholder="Search"
    value="{{ filters.search }}"
  />

  <select name="status">
    <option value="">All statuses</option>
    {% for s in statuses %}
    <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>
      {{ s }}
    </option>
    {% endfor %}
  </select>

  <select name="priority">
    <option value="">All priorities</option>
    {% for p in priorities %}
    <option
      value="{{ p }}" {% if filters.priority == p %}selected{% endif %}
    >
      {{ p }}
    </option>
    {% endfor %}
  </select>

  <input
    type="text"
    name="assignee"
    placeholder="Assignee"
    value="{{ filters.assignee }}"
  />
  <button type="submit">Filter</button>
</form>

<div class="ticket-list">
  {% for ticket in tickets %}
  <a class="card ticket-row" href="/tickets/{{ ticket.id }}">
    <div>
      <div class="ticket-key">{{ ticket.key }}</div>
      <div class="ticket-title">{{ ticket.title }}</div>
      <div class="ticket-meta">
        Assignee: {{ ticket.assignee or "Unassigned" }}
      </div>
    </div>
    <div class="ticket-badges">
      <span class="badge">{{ ticket.status }}</span>
      <span class="badge priority-{{ ticket.priority|lower }}"
        >{{ ticket.priority }}</span
      >
    </div>
  </a>
  {% else %}
  <div class="card">No tickets found.</div>
  {% endfor %}
</div>
{% endblock %}
